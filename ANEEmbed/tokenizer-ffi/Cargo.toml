[package]
name = "tokenizer_ffi"
version = "0.1.0"
edition = "2021"
description = "HF tokenizers (the library Python's fast tokenizer uses) and UMAP (Apple's Rust port) behind one C ABI for the Swift apps"

[lib]
crate-type = ["staticlib"]

[dependencies]
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig", "esaxx_fast"] }
umap = { path = "../umap-ffi/umap" }      # the Map page's layout, vendored from apple/embedding-atlas
ndarray = "0.17"

[profile.release]
lto = true
codegen-units = 1
