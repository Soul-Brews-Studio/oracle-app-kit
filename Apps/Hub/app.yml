targets:
  Oracles:
    type: application
    supportedDestinations: [macOS]
    sources:
      - path: Apps/Hub
        excludes: ["app.yml", "Info.plist"]
      - path: Apps/Shared
    dependencies:
      - package: OracleKit
      - package: ANEEmbed
        product: ANEEmbedCore
    preBuildScripts:
      - name: Build the tokenizer (Rust)
        basedOnDependencyAnalysis: false
        script: |
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v cargo >/dev/null; then
            echo "error: cargo not found: the hub's in-process ANE embedder builds its tokenizer with Rust. Install it, then build again:"
            echo "error:   brew install rustup && rustup-init -y && . ~/.cargo/env"
            exit 1
          fi
          # Every build: a no-op when current, and an edit to the Rust code is never skipped.
          # From the crate's folder, so .cargo/config.toml (MACOSX_DEPLOYMENT_TARGET = 14.0) applies.
          cd "$SRCROOT/ANEEmbed/tokenizer-ffi" && cargo build --release --locked
    postBuildScripts:
      - name: Bundle the ANE model
        basedOnDependencyAnalysis: false
        script: |
          # Only a complete export: what the app loads at run time (it never compiles inside its own bundle).
          SRC="$HOME/Library/Application Support/ANEEmbed/embeddinggemma2-w16"
          DST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/ANEModel/embeddinggemma2-w16"
          missing=""
          for f in manifest.json embed_scaled.f16 tokenizer; do [ -e "$SRC/$f" ] || missing="$missing $f"; done
          if [ -f "$SRC/manifest.json" ]; then
            for b in $(plutil -extract buckets json -o - "$SRC/manifest.json" | tr -d '[] ' | tr ',' ' '); do
              [ -d "$SRC/compiled/$b.mlmodelc" ] || missing="$missing compiled/$b.mlmodelc"
            done
          fi
          if [ -z "$missing" ]; then
            mkdir -p "$DST"
            rsync -a --delete --exclude packages "$SRC/" "$DST/"
            echo "bundled the ANE model: $(plutil -extract vector_space_identity raw -o - "$SRC/manifest.json")"
          else
            rm -rf "$DST"
            echo "warning: no complete ANE model in $SRC (missing:$missing): the hub runs without it and embeds through the HTTP service on 127.0.0.1:11435"
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.laris.oracle.hub
        PRODUCT_NAME: ARRA Oracles
        INFOPLIST_KEY_CFBundleDisplayName: ARRA Oracles
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO             # runs herdr and maw, opens the other oracle apps
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO     # the build copies the ANE model from Application Support
        ARCHS: arm64                          # the Neural Engine and the Float16 code exist only on Apple silicon
    info:
      path: Apps/Hub/Info.plist
      properties:
        CFBundleName: ARRA Oracles
        CFBundleDisplayName: ARRA Oracles
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: co.laris.oracle.hub
            CFBundleURLSchemes: [oracle-hub]
