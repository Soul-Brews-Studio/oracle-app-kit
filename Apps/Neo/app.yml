targets:
  Neo:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - path: Apps/Neo
        excludes: ["app.yml", "Info.plist", "Widget/**", "*.entitlements"]
    dependencies:
      - package: OracleKit
      - target: NeoWidget
    entitlements:
      path: Apps/Neo/Neo.entitlements
      properties:          # xcodegen WRITES this file from here — a path alone becomes an empty <dict/>
        com.apple.security.application-groups: [6K28WEXX78.co.laris.oracle.neo]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.laris.oracle.neo
        PRODUCT_NAME: Neo
        INFOPLIST_KEY_CFBundleDisplayName: Neo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
    info:
      path: Apps/Neo/Info.plist
      properties:
        CFBundleName: Neo
        CFBundleDisplayName: Neo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        CFBundleURLTypes:            # widget taps open oracle-<name>://open — the app must own the scheme
          - CFBundleURLName: co.laris.oracle.neo
            CFBundleURLSchemes: [oracle-neo]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Anything for Neo
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.item, public.content, public.folder, public.url, public.data]
  NeoWidget:
    type: app-extension
    supportedDestinations: [macOS, iOS]
    sources:
      - path: Apps/Neo/Widget
        excludes: ["*.entitlements", "Info.plist"]
      - path: Apps/Neo/NeoConfig.swift
    dependencies:
      - package: OracleKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Apps/Neo/Widget/NeoWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [6K28WEXX78.co.laris.oracle.neo]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.laris.oracle.neo.widget
        PRODUCT_NAME: NeoWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        ENABLE_APP_SANDBOX: YES
    info:
      path: Apps/Neo/Widget/Info.plist
      properties:
        CFBundleDisplayName: Neo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
