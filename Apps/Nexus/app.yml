targets:
  Nexus:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - path: Apps/Nexus
        excludes: ["app.yml", "Info.plist", "Widget/**", "*.entitlements"]
    dependencies:
      - package: OracleKit
      - target: NexusWidget
    entitlements:
      path: Apps/Nexus/Nexus.entitlements
      properties:          # xcodegen WRITES this file from here — a path alone becomes an empty <dict/>
        com.apple.security.application-groups: [6K28WEXX78.co.laris.oracle.nexus]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.laris.oracle.nexus
        PRODUCT_NAME: Nexus
        INFOPLIST_KEY_CFBundleDisplayName: Nexus
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
    info:
      path: Apps/Nexus/Info.plist
      properties:
        CFBundleName: Nexus
        CFBundleDisplayName: Nexus
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        CFBundleURLTypes:            # widget taps open oracle-<name>://open — the app must own the scheme
          - CFBundleURLName: co.laris.oracle.nexus
            CFBundleURLSchemes: [oracle-nexus]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Anything for Nexus
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.item, public.content, public.folder, public.url, public.data]
        NSServices:                  # right-click → Services, anywhere: selected text, links, Finder files
          - NSMenuItem: { default: "New Nexus Oracle issue" }
            NSMessage: newIssue
            NSPortName: Nexus
            NSSendTypes: [public.utf8-plain-text, public.plain-text, public.url, public.file-url]
            NSSendFileTypes: [public.item]
            NSRequiredContext: {}       # enabled by default — without it macOS hides the service until switched on
          - NSMenuItem: { default: "Send to Nexus Oracle inbox" }
            NSMessage: sendToInbox
            NSPortName: Nexus
            NSSendTypes: [public.utf8-plain-text, public.plain-text, public.url, public.file-url]
            NSSendFileTypes: [public.item]
            NSRequiredContext: {}
  NexusWidget:
    type: app-extension
    supportedDestinations: [macOS, iOS]
    sources:
      - path: Apps/Nexus/Widget
        excludes: ["*.entitlements", "Info.plist"]
      - path: Apps/Nexus/NexusConfig.swift
    dependencies:
      - package: OracleKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Apps/Nexus/Widget/NexusWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [6K28WEXX78.co.laris.oracle.nexus]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.laris.oracle.nexus.widget
        PRODUCT_NAME: NexusWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        ENABLE_APP_SANDBOX: YES
    info:
      path: Apps/Nexus/Widget/Info.plist
      properties:
        CFBundleDisplayName: Nexus Oracle
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
