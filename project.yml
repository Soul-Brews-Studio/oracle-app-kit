name: OracleApps
options:
  bundleIdPrefix: co.laris.oracle
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 6K28WEXX78
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
packages:
  OracleKit:
    path: OracleKit
  ANEEmbed:            # the in-process ANE embedder the hub links (copied from the Chippy service)
    path: ANEEmbed
aggregateTargets:
  CalVer:              # runs first in every build: one CalVer for an app AND its extensions (scripts/calver-stamp.sh)
    buildScripts:
      - name: Fix this build's CalVer
        basedOnDependencyAnalysis: false
        script: sh "$SRCROOT/scripts/calver-stamp.sh" begin
include:
  - path: apps.yml
    relativePaths: false
